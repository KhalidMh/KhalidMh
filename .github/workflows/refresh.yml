name: refresh profile cards

# Redraws every card from public GitHub and npm data, then commits assets/, README.md and scripts/state.json
# when any of them changed. No secret to set up: the built-in GITHUB_TOKEN only lifts the API rate limit.
on:
  schedule:
    - cron: "23 3 * * *"   # every night, 03:23 UTC (04:23 in Casablanca)
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "profile.json"
      - "scripts/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - id: build
        run: python scripts/build.py
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md scripts/state.json
          if git diff --cached --quiet; then
            echo "nothing changed, nothing committed"
          else
            git commit -m "chore: refresh profile cards"
            git pull --rebase
            git push
          fi
      - name: Fail the run when a source failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "build.py failed: see the build step log"
          exit 1
